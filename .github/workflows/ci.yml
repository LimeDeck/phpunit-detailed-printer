name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHPUnit ${{ matrix.phpunit }} on PHP ${{ matrix.php }} (${{ matrix.os || 'ubuntu-latest' }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { phpunit: '10.5', php: '8.1' }
          - { phpunit: '10.5', php: '8.2' }
          - { phpunit: '10.5', php: '8.3' }
          - { phpunit: '10.5', php: '8.4' }
          - { phpunit: '11.5', php: '8.2' }
          - { phpunit: '11.5', php: '8.3' }
          - { phpunit: '11.5', php: '8.4' }
          - { phpunit: '12.5', php: '8.3' }
          - { phpunit: '12.5', php: '8.4' }
          - { phpunit: '12.5', php: '8.5' }
          - { phpunit: '13', php: '8.4' }
          - { phpunit: '13', php: '8.5' }
          - { phpunit: '13', php: '8.5', os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer require "phpunit/phpunit:^${{ matrix.phpunit }}" -W --no-interaction --no-progress

      - run: php vendor/bin/phpunit

  cs:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: composer cs:check
